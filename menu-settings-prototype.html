<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portal 2.0 — 菜單設定</title>
<style>
* { box-sizing: border-box; }
[hidden] { display: none !important; }
:root {
  --pri: #58B6A8; --pri-bg: #E1F2F0; --bg: #F5F8F9; --line: #E4E6E9; --txt: #53545C; --sub: #8E8F98; --sec: #5292D9;
  --ok: #4CAF50; --warn: #d97706; --warn-bg: #fff4e0; --err: #E8574D; --err-bg: #fdecec;
  --c-menu: #58B6A8; --c-cat: #5292D9; --c-item: #53545C; --c-attr: #E0953A; --c-opt: #66BB6A;
}
html, body { margin: 0; height: 100%; }
body { font-family: "PingFang TC","Noto Sans TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif; font-size: 14px; color: var(--txt); background: var(--bg); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font-family: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font-family: inherit; font-size: 14px; color: var(--txt); }

.app { display: flex; height: 100vh; }
/* sidebar */
.sidebar { width: 208px; background: #fff; color: var(--txt); border-right: 1px solid var(--line); flex-shrink: 0; display: flex; flex-direction: column; }
.sb-head { height: 56px; display: flex; align-items: center; padding: 0 20px; color: var(--pri); font-weight: 700; font-size: 18px; letter-spacing: .5px; }
.sb-sec { padding: 14px 20px 6px; font-size: 12px; color: var(--sub); }
.sb-item { padding: 10px 14px; margin: 2px 12px; border-radius: 8px; font-size: 14px; color: var(--txt); }
.sb-item.active { background: var(--pri-bg); color: #2f8f81; font-weight: 600; }

/* main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar { background: #fff; border-bottom: 1px solid var(--line); box-shadow: 0 6px 54px rgba(0,0,0,.05); padding: 0 24px; height: 60px; display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
.topbar h1 { font-size: 18px; margin: 0; }
.store-sel { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--sub); }
.store-sel select { padding: 6px 10px; border: 1px solid #cfd5de; border-radius: 6px; font-size: 14px; color: var(--txt); background: #fff; }
.dirty-hint { font-size: 12px; color: var(--warn); font-weight: 600; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.status { padding: 4px 10px; border-radius: 99px; font-size: 12px; font-weight: 600; cursor: pointer; border: 0; }
.status.ok { background: var(--pri-bg); color: #2f8f81; }
.status.warn { background: var(--warn-bg); color: var(--warn); }
.spacer { flex: 1; }
.btn { border: 1px solid #d4d4d4; background: #fff; border-radius: 4px; padding: 7px 14px; font-size: 14px; color: var(--txt); white-space: nowrap; }
.btn:hover { background: #f3f3f4; }
.btn.pri { background: var(--pri); color: #fff; border-color: var(--pri); font-weight: 600; letter-spacing: .5px; }
.btn.pri:hover { background: #4aa395; }
.btn.danger { color: var(--err); border-color: #f1b9b9; }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--pri); }
.btn.ghost:hover { background: var(--pri-bg); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #ffb020; margin-right: 6px; }
.tabbar { background: #fff; border-bottom: 1px solid var(--line); padding: 0 24px; display: flex; align-items: center; flex-shrink: 0; gap: 4px; }
.tab { padding: 16px 22px; border: 0; background: transparent; font-size: 16px; color: var(--txt); border-bottom: 3px solid transparent; }
.tab:hover { color: var(--pri); }
.tab.active { color: var(--pri); font-weight: 700; border-bottom-color: var(--pri); }
.tab .cnt { font-size: 12px; background: #eef0f3; color: #666; border-radius: 99px; padding: 1px 7px; margin-left: 6px; font-weight: 500; }
.add-wrap { position: relative; }
.dropdown { position: absolute; right: 0; top: 40px; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); min-width: 150px; z-index: 40; overflow: hidden; }
.dropdown button { display: block; width: 100%; text-align: left; border: 0; background: #fff; padding: 10px 16px; font-size: 14px; }
.dropdown button:hover { background: var(--pri-bg); }

.body { flex: 1; display: flex; min-height: 0; }
.content { flex: 1; overflow-y: auto; padding: 20px 24px 60px; min-width: 0; }
.checks { width: 300px; background: #fff; border-left: 1px solid var(--line); overflow-y: auto; flex-shrink: 0; padding: 16px; }
.checks h3 { font-size: 14px; margin: 0 0 8px; display: flex; align-items: center; gap: 6px; }
.checks section { margin-bottom: 20px; }
.chk-item { padding: 8px 10px; border-radius: 6px; background: var(--warn-bg); margin-bottom: 6px; font-size: 13px; cursor: pointer; line-height: 1.5; }
.chk-item:hover { filter: brightness(.97); }
.chk-item b { color: var(--warn); display: block; font-size: 12px; }
.chk-ok { padding: 10px; background: #e3f6ea; color: var(--ok); border-radius: 6px; font-size: 13px; }
.log { font-size: 12px; color: #555; padding: 6px 0; border-bottom: 1px dashed var(--line); line-height: 1.5; }
.log small { color: var(--sub); display: block; }
.res { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 13px; }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; }
.badge.none { background: #eef0f3; color: var(--sub); }
.badge.ok { background: #e3f6ea; color: var(--ok); } .badge.part { background: var(--warn-bg); color: var(--warn); } .badge.fail { background: var(--err-bg); color: var(--err); }
.muted { color: var(--sub); }

/* tree */
.toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.toolbar .hint { color: var(--sub); font-size: 13px; }
.tree { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; margin-bottom: 18px; }
.row { display: grid; grid-template-columns: minmax(380px,1fr) 70px repeat(5, 66px) 52px 196px; min-width: 1020px; align-items: center; min-height: 44px; border-bottom: 1px solid #eef0f3; padding-right: 8px; }
.row:last-child { border-bottom: 0; }
.row > div { padding: 0 4px; }
.row .c { text-align: center; }
.row .nm { display: flex; align-items: center; gap: 8px; min-width: 0; padding-left: calc(var(--lv, 0) * 26px + 10px); }
.row.menu { background: #f3f7ff; min-height: 52px; font-weight: 700; }
.row.menu .name { flex-shrink: 0; max-width: 260px; }
.row.cat { background: #faf8ff; }
.row.attr { background: #fffaf2; min-height: 38px; font-size: 13px; }
.row.opt { min-height: 34px; font-size: 13px; }
.row.heads { background: #fafbfc; min-height: 30px; font-size: 12px; color: var(--sub); }
.row.dim { opacity: .55; }
.row.span-all { display: flex; }
.caret { width: 22px; height: 22px; border: 0; background: transparent; color: #666; border-radius: 4px; flex-shrink: 0; font-size: 12px; padding: 0; }
.caret:hover { background: #e5e8ed; }
.caret.ph { visibility: hidden; }
.tag { font-size: 11px; font-weight: 700; color: #fff; padding: 2px 7px; border-radius: 4px; flex-shrink: 0; }
.tag.menu { background: var(--c-menu); } .tag.cat { background: var(--c-cat); } .tag.item { background: var(--c-item); } .tag.attr { background: var(--c-attr); } .tag.opt { background: var(--c-opt); }
.name { flex: 0 1 auto; max-width: 220px; cursor: text; border-radius: 4px; padding: 2px 4px; border: 1px dashed transparent; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.name:hover { border-color: #b9c2d0; background: #fff; }
.row.item .name { font-weight: 500; }
.meta { flex: 0 1 auto; min-width: 0; font-size: 12px; color: var(--sub); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chip { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: #eef0f3; color: #555; font-weight: 500; margin-right: 3px; }
.chip.w { background: var(--warn-bg); color: var(--warn); } .chip.r { background: var(--err-bg); color: var(--err); } .chip.b { background: var(--pri-bg); color: #2f8f81; }
.inl-input { font: inherit; border: 1px solid var(--pri); border-radius: 4px; padding: 3px 6px; width: 100%; outline: none; box-shadow: 0 0 0 3px rgba(88,182,168,.22); }
.acts { white-space: nowrap; display: flex; gap: 3px; justify-content: flex-end; }
.ib { white-space: nowrap; border: 1px solid var(--line); background: #fff; border-radius: 5px; padding: 3px 7px; font-size: 12px; color: #555; }
.ib:hover { background: var(--pri-bg); color: var(--pri); border-color: #a9dbd3; }
.ib:disabled { opacity: .35; cursor: default; }
.ib.t { color: #2f8f81; border-color: #a9dbd3; }
.pc { border: 0; cursor: pointer; flex-shrink: 0; font-size: 11px; background: var(--pri-bg); color: #2f8f81; border-radius: 4px; padding: 1px 7px; font-weight: 600; }
/* uber-style tree */
.content.fill { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
.u-layout { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 32px; align-items: stretch; flex: 1; min-height: 0; grid-template-rows: minmax(0, 1fr); padding: 20px 24px; }
.u-main { overflow-y: auto; min-height: 0; padding-right: 4px; padding-bottom: 40px; }
.u-main > .toolbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding-bottom: 12px; margin-bottom: 0; }
.u-navlist { flex: 1; min-height: 170px; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
.u-nav > label, .u-nav > .u-mhead { flex: none; }
.u-nav { display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow-y: auto; background: #fff; border: 1px solid #D4D4D4; border-radius: 8px; padding: 16px; box-shadow: 0 6px 54px rgba(0,0,0,.04); }
.u-msel { display: block; position: relative; margin: 8px 0 14px; }
.u-msel span { position: absolute; top: -9px; left: 10px; padding: 0 4px; background: #fff; font-size: 12px; line-height: 18px; color: var(--sub); z-index: 1; }
.u-msel select { width: 100%; height: 48px; padding: 0 38px 0 14px; border: 1px solid #D4D4D4; border-radius: 4px; background: #fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9' viewBox='0 0 14 9'><path d='M1.5 1.5l5.5 5.5 5.5-5.5' fill='none' stroke='%238E8F98' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat right 14px center; appearance: none; -webkit-appearance: none; font-size: 16px; font-weight: 400; color: var(--txt); cursor: pointer; }
.u-msel select:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px rgba(88,182,168,.22); }
.u-menus { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.u-menus button { border: 1px solid var(--line); background: #fff; border-radius: 99px; padding: 5px 12px; font-size: 13px; }
.u-menus button.active { background: var(--pri); color: #fff; border-color: var(--pri); }
.u-mhead { padding: 0 0 14px; margin-bottom: 8px; border-bottom: 1px solid var(--line); }
.u-mhead .mh-l1 { font-size: 13px; color: var(--txt); line-height: 1.6; }
.u-mhead .mh-ch { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 0; font-size: 13px; color: var(--txt); line-height: 1.7; margin: 0; }
.u-mhead .mh-ch span { display: inline-block; min-width: 42px; margin-right: 6px; color: #A5A7AE; }
.u-mhead .mh-sum { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 2px 0; cursor: pointer; }
.u-mhead .mh-sum .s-t { display: block; min-width: 0; }
.u-mhead .mh-sum .s1 { display: block; font-size: 13px; color: var(--txt); line-height: 1.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-mhead .mh-sum .s2 { display: block; font-size: 13px; color: var(--sub); line-height: 1.6; }
.u-mhead .mh-sum em { font-style: normal; font-size: 12px; font-weight: 600; color: #2f8f81; flex-shrink: 0; line-height: 1.9; }
.u-mhead .mh-sum em::after { content: " ▾"; font-size: 9px; }
.u-mhead .mh-sum.open em::after { content: " ▴"; }
.u-mhead .mh-sum:hover em { text-decoration: underline; }
.u-mhead .mh-sum.open .s1 { font-weight: 600; }
.u-mhead .mh-more { border: 0; background: none; padding: 4px 0; margin: 2px 0 6px; font-size: 13px; color: #2f8f81; font-weight: 600; }
.u-mhead .mh-more i { font-style: normal; font-size: 10px; }
.u-mhead .mh-extra { padding: 10px 2px 0; }
.u-mhead .mh-extra .btn { margin-top: 10px; }
.u-mhead .mh-ch.store { cursor: pointer; }
.u-mhead .mh-ch.store:hover { color: #2f8f81; }
.u-mhead .mh-ch.store i { font-style: normal; color: #A5A7AE; margin-left: 2px; }
.u-mhead .mh-l2 { font-size: 12px; color: var(--sub); line-height: 1.5; margin: 2px 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-mhead dl { margin: 12px 0 14px; display: grid; gap: 10px; }
.u-mhead dt { font-size: 12px; color: var(--sub); margin-bottom: 2px; }
.u-mhead dd { margin: 0; font-size: 14px; color: var(--txt); }
.u-mhead dd.chs { display: flex; flex-wrap: wrap; gap: 4px; }
.u-mhead dd.chs .chip { margin: 0; font-size: 12px; padding: 2px 8px; }
.u-mhead .slotline { white-space: nowrap; }
.u-mhead b { font-size: 18px; display: block; font-weight: 700; }
.u-mhead .ib { margin-top: 8px; }
.u-navitem { display: flex; justify-content: space-between; text-align: left; border: 0; background: transparent; padding: 12px 14px; font-size: 15px; border-left: 3px solid transparent; border-radius: 0 6px 6px 0; }
.u-navitem:hover { background: #eceef1; }
.u-navitem.active:hover { background: var(--pri-bg); }
.u-navitem.active { background: var(--pri-bg); border-left-color: var(--pri); color: #2f8f81; font-weight: 700; }
.u-navitem.active .muted { color: #2f8f81; }
.u-navitem.add { justify-content: flex-start; gap: 8px; margin-top: 4px; }
.u-navitem.add, .u-navitem.add .pl { color: var(--sub); }
.u-cat { margin-bottom: 12px; scroll-margin-top: 4px; border: 1px solid #d4d7dc; border-radius: 8px; background: #fff; padding: 0 14px 14px; box-shadow: 0 6px 54px rgba(0,0,0,.04); }
.u-cathead { display: flex; align-items: center; gap: 10px; padding: 14px 0; margin-bottom: 16px; border-bottom: 1px solid #e3e6ea; }
.u-cat.closed { padding-bottom: 0; }
.u-cat.closed .u-cathead { margin-bottom: 0; border-bottom: 0; padding: 10px 0; }
.u-cat.closed { margin-bottom: 8px; }
.u-cathead h2 { margin: 0; font-size: 24px; font-weight: 700; }
.u-cathead h2 .name { max-width: 420px; border-color: transparent; }
.u-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 1100px) { .u-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1520px) { .u-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.chip-attr { border: 1px solid #f0c98a; background: var(--warn-bg); color: #8a5300; border-radius: 99px; padding: 3px 10px; font-size: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.chip-attr.more { padding: 3px 8px; flex-shrink: 0; background: #fff; border-color: #d4d4d4; color: var(--txt); }
.chip-attr.add { background: #fff; border: 1px dashed #b8bcc2; color: var(--sub); }
.chip-attr.add:hover, .chip-attr.more:hover { border-color: var(--pri); color: #2f8f81; background: var(--pri-bg); }
.attr-pop { position: fixed; z-index: 45; width: 300px; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 10px 36px rgba(0,0,0,.18); }
.ap-head { padding: 10px 14px; font-weight: 700; font-size: 13px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 8px; }
.ap-head .muted { font-weight: 400; font-size: 12px; }
.ap-list { max-height: 240px; overflow-y: auto; }
.ap-row { display: flex; align-items: center; gap: 10px; padding: 9px 14px; cursor: pointer; }
.ap-row:hover { background: #F5FAF9; }
.ap-ck { width: 18px; height: 18px; border: 1.5px solid #c3c8cf; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; flex-shrink: 0; }
.ap-row.on .ap-ck { background: var(--pri); border-color: var(--pri); }
.ap-nm { flex: 1; font-size: 14px; } .ap-nm small { display: block; color: var(--sub); font-size: 11px; }
.ap-foot { padding: 6px 8px; border-top: 1px solid var(--line); }
.chip-attr small { margin-left: 5px; opacity: .7; }
.chip-attr:hover { background: #ffe8bd; }
/* card v3: clear hierarchy */
.u-card { position: relative; display: grid; grid-template-columns: 1fr 148px; grid-template-rows: 111px 78px 46px; height: 235px; background: #fff; border: 1px solid #d9dce1; border-radius: 8px; overflow: hidden; transition: box-shadow .15s; }
.u-card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); }
.u-card.dim .u-body, .u-card.dim .u-attrsec { opacity: .5; }
.u-card.dim .u-img::before { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.55); }
.u-card.dim .u-img .u-edit { z-index: 1; }
.u-card.sold .u-img::before { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.55); }
.u-card.sold .u-img .u-badge, .u-card.sold .u-img .u-edit { z-index: 1; }
.u-body { padding: 12px 4px 0 14px; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
.u-name .name { display: block; font-size: 17px; font-weight: 700; color: #3b3c42; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-meta { display: flex; align-items: center; gap: 6px; height: 22px; font-size: 12px; color: var(--sub); white-space: nowrap; overflow: hidden; }
.u-sku { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.u-meta .chip { flex-shrink: 0; margin: 0; }
.u-price { display: flex; align-items: center; gap: 6px; margin: 6px 0 4px; white-space: nowrap; }
.u-price .name { flex-shrink: 0; font-size: 20px; font-weight: 700; color: var(--pri-d, #2f8f81); padding: 0 4px; margin-left: -4px; }
.u-desc { font-size: 13px; color: var(--sub); line-height: 1.45; }
.u-desc .name { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; margin-left: -4px; }
.u-ph { width: 66px; height: 66px; border-radius: 50%; background: linear-gradient(180deg,#f6f6f6,#e9e9e9); box-shadow: 0 2px 8px rgba(0,0,0,.06); display: flex; align-items: center; justify-content: center; }
.u-img { position: relative; background: #D9D9D9 center/cover; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 700; color: #B8BBC0; width: 148px; height: 111px; overflow: hidden; }
.u-badge { position: absolute; right: 0; top: 0; background: var(--err); color: #fff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-bottom-left-radius: 6px; letter-spacing: .5px; z-index: 1; }
.u-badge.off { background: #8E8F98; }
.u-tags { position: absolute; right: 4px; bottom: 4px; max-width: calc(100% - 8px); display: flex; flex-direction: row; justify-content: flex-end; gap: 4px; z-index: 1; }
.u-tag[hidden] { display: none; }
.u-tag { display: inline-flex; align-items: center; box-sizing: border-box; height: 24px; padding: 0 10px; border: 1px solid #D4D4D4; border-radius: 100px; background: #F5F8F9; color: #545454; font-size: 12px; font-weight: 400; line-height: 1.5; white-space: nowrap; box-shadow: 0 4px 8px -2px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.05); }
.u-edit { position: absolute; right: 6px; bottom: 6px; border: 0; background: #fff; border-radius: 99px; padding: 5px 11px; font-size: 12px; font-weight: 600; box-shadow: 0 1px 6px rgba(0,0,0,.25); }
.u-edit:hover { background: var(--pri); color: #fff; }
.u-attrsec { grid-column: 1 / -1; padding: 8px 16px 0; border-top: 1px dashed #e3e6ea; overflow: hidden; }
.u-price .pc { padding: 1px 5px; font-size: 10.5px; letter-spacing: -.2px; }
.u-seclabel { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: var(--sub); letter-spacing: .5px; margin-bottom: 4px; }
.u-attrs { display: flex; flex-wrap: nowrap; gap: 6px; overflow: hidden; }
.u-attrs .chip-attr { max-width: 100%; flex-shrink: 0; white-space: nowrap; }
.u-attrs .chip-attr[data-chip] { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.u-foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 16px; border-top: 1px solid #eef0f3; background: #fafbfc; font-size: 13px; }
.u-sold { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--txt); background: none; border: 0; padding: 0; font-size: 13px; }
.u-sold.on { color: var(--sub); font-weight: 600; }
/* card v4: member-group card style */
.u-card { border: 1px solid #D4D4D4; border-radius: 12px; }
.u-body { padding: 14px 4px 0 18px; }
.u-name .name { font-size: 18px; color: #53545C; }
.u-seclabel { font-size: 13px; font-weight: 400; color: var(--txt); letter-spacing: 0; margin-bottom: 6px; }
.u-seclabel .u-skutag { font-size: 11px; color: var(--sub); }
.u-attrsec { border-top: 1px solid #E3E3E3; padding: 10px 18px 0; }
.chip-attr { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #D4D4D4; color: var(--txt); border-radius: 99px; padding: 3px 10px; font-size: 13px; }
.chip-attr:hover { background: #F5FAF9; border-color: var(--pri); }
.chip-attr .dot2 { width: 12px; height: 12px; border-radius: 50%; background: #E0E0E0; flex-shrink: 0; }
.chip-attr .dot2.req { background: var(--pri); }
.chip-attr.more { padding: 3px 10px; }
.u-foot { background: #fff; border-top: 1px solid #D4D4D4; padding: 0 12px 0 18px; }
.u-ic { border: 0; background: transparent; width: 32px; height: 32px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.u-ic:hover { background: #F3F3F4; }
.u-ic.edit { color: #58B6A8; } .u-ic.del { color: #FF8A80; }
.u-ic.confirm { width: auto; padding: 0 10px; font-size: 12px; font-weight: 600; background: var(--err-bg); color: var(--err); }
.u-img { cursor: pointer; }
/* card v5: follows Figma "Item Card" (24:1009) */
.u-card { grid-template-columns: 1fr 152px; grid-template-rows: 129px 75px 46px; height: 252px; border: 1px solid #D4D4D4; border-radius: 8px; background: #fff; box-shadow: none; }
.u-card:hover { box-shadow: none; border-color: #B8BBC0; }
.u-body { padding: 12px 8px 0 12px; display: flex; flex-direction: column; gap: 4px; grid-template-rows: none; overflow: hidden; }
.u-name .name { font-size: 18px; font-weight: 400; line-height: 27px; color: #53545C; padding: 0 4px; margin-left: -4px; }
.u-price { height: 24px; margin: 0; gap: 8px; }
.u-price .name { font-size: 20px; font-weight: 600; line-height: 24px; color: #53545C; padding: 0 4px; margin-left: -4px; }
.u-price .pc { height: 24px; padding: 0 10px; font-size: 13px; font-weight: 500; background: #F3F3F4; color: #53545C; border-radius: 99px; letter-spacing: 0; }
.u-skurow { font-size: 14px; line-height: 21px; color: #8E8F98; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.u-desc { font-size: 14px; line-height: 21px; color: #8E8F98; }
.u-desc .name { padding: 0 4px; margin-left: -4px; }
.u-img { width: 140px; height: 105px; margin: 12px 12px 0 0; border-radius: 6px; }
.u-badge { border-bottom-left-radius: 6px; }
.u-attrsec { border-top: 1px solid #D4D4D4; padding: 12px 12px 0; }
.u-seclabel { font-size: 14px; line-height: 21px; margin-bottom: 4px; color: #53545C; }
.u-attrs { gap: 8px; }
.chip-attr { height: 24px; padding: 0 12px; font-size: 14px; line-height: 22px; }
.chip-attr.add { border-style: dashed; color: #8E8F98; }
.chip-attr.more { padding: 0 12px; }
.u-foot { height: 46px; padding: 0 8px 0 12px; border-top: 1px solid #D4D4D4; background: #fff; gap: 4px; }
.u-sold { display: inline-flex; align-items: center; gap: 12px; font-size: 14px; color: #53545C; font-weight: 400; }
.u-sold.on { color: #53545C; }
.msw { position: relative; width: 36px; height: 14px; border-radius: 99px; background: #D4D4D4; margin: 0 6px 0 8px; flex-shrink: 0; transition: .15s; }
.msw i { position: absolute; top: -5px; left: -5px; width: 24px; height: 24px; border-radius: 50%; background: #A6A6A6; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: .15s; }
.msw.on { background: #B7DDD7; }
.msw.on i { left: 17px; background: #58B6A8; }
.u-ic { width: 28px; height: 28px; color: #53545C; }
.u-ic:disabled { opacity: .3; cursor: default; }
.u-ic.edit { color: #58B6A8; } .u-ic.del { color: #FF8A80; }
.u-main { min-width: 0; }
.u-add { height: 252px; border: 2px dashed #c3c9d2; background: transparent; border-radius: 10px; color: #6b7480; font-size: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
.u-add span { font-size: 28px; line-height: 1; }
.u-add:hover { border-color: var(--pri); color: #2f8f81; background: var(--pri-bg); }
.u-addcat { width: 100%; padding: 16px; border: 2px dashed #c3c9d2; background: transparent; border-radius: 10px; font-size: 15px; color: #6b7480; }
.u-addcat:hover { border-color: var(--pri); color: var(--pri); background: var(--pri-bg); }
/* switch */
.sw { position: relative; display: inline-block; width: 34px; height: 20px; border-radius: 99px; background: #ccd1d9; cursor: pointer; transition: .15s; vertical-align: middle; }
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: .15s; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
.sw.on { background: var(--pri); } .sw.on::after { left: 16px; }
.sw.part { background: #8fd0a9; }
.sw.part::after { left: 9px; }
.sw.dis { opacity: .35; cursor: not-allowed; }
.sw.sold.on { background: var(--err); }
.empty { padding: 28px; text-align: center; color: var(--sub); }

/* table (items, attrs) */
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 16px; }
.card { background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 54px rgba(0,0,0,.05); padding: 16px 18px; }
.card h4 { margin: 0 0 10px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.card dl { margin: 0; display: grid; grid-template-columns: 76px 1fr; gap: 8px 10px; font-size: 13px; }
.card dt { color: var(--sub); } .card dd { margin: 0; }
.card .foot { margin-top: 14px; display: flex; gap: 8px; }
table.tb { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 54px rgba(0,0,0,.05); overflow: hidden; }
.tb th { text-align: left; font-size: 13px; color: var(--txt); font-weight: 600; padding: 12px; background: #F3F3F4; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tb td { padding: 10px 12px; border-bottom: 1px solid #eef0f3; font-size: 13px; vertical-align: middle; }
.tb tr.click { cursor: pointer; } .tb tr.click:hover td { background: #F5FAF9; }
.tb tr.dim td { opacity: .55; }
.tb .g { color: #aab0ba; }
.sbox { position: relative; display: inline-flex; align-items: center; }
.sbox .s-ic { position: absolute; left: 10px; color: var(--sub); pointer-events: none; }
.sbox .search { padding-left: 36px; }
.search { padding: 8px 12px; border: 1px solid #D4D4D4; border-radius: 4px; width: 280px; background: #fff; }
.search:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px rgba(88,182,168,.22); }

/* preview */
.pv-wrap { display: flex; gap: 32px; align-items: flex-start; }
.pv-ctrl { width: 240px; }
.seg { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
.seg button { text-align: left; padding: 10px 14px; border: 1px solid var(--line); background: #fff; border-radius: 8px; font-size: 14px; }
.seg button.active { border-color: var(--pri); background: var(--pri-bg); color: var(--pri); font-weight: 700; }
.phone { width: 375px; height: 700px; background: #fff; border: 10px solid #1c1f24; border-radius: 36px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 12px 32px rgba(0,0,0,.18); flex-shrink: 0; }
.phone .ph-head { padding: 14px 16px 10px; border-bottom: 1px solid #eee; }
.phone .ph-head b { font-size: 16px; display: block; }
.phone .ph-cats { display: flex; gap: 8px; padding: 8px 12px; overflow-x: auto; border-bottom: 1px solid #eee; flex-shrink: 0; }
.phone .ph-cats span { white-space: nowrap; font-size: 13px; padding: 5px 12px; background: #f1f3f6; border-radius: 99px; }
.phone .ph-body { flex: 1; overflow-y: auto; padding: 4px 14px 24px; }
.ph-cat { font-weight: 700; font-size: 15px; margin: 16px 0 6px; }
.ph-item { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f0f1f3; }
.ph-item.sold { opacity: .4; }
.ph-img { width: 64px; height: 64px; border-radius: 8px; background: #E8EAEC; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; color: #fff; flex-shrink: 0; background-size: cover; background-position: center; }
.ph-item .nm { font-weight: 600; font-size: 14px; }
.ph-item .pr { font-size: 14px; margin-top: 4px; }
.ph-item .tg { margin-top: 4px; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(20,24,32,.35); z-index: 50; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 520px; max-width: 100vw; background: #fff; z-index: 51; display: flex; flex-direction: column; box-shadow: -8px 0 32px rgba(0,0,0,.18); }
.drawer.w-menu, .drawer.w-cat, .drawer.w-item, .drawer.w-attr { width: 720px; }
.drawer.anim { animation: slide .18s ease-out; }
@keyframes slide { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.dr-head { padding: 14px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.dr-head h2 { margin: 0; font-size: 17px; flex: 1; display: flex; align-items: center; gap: 8px; }
.dr-body { flex: 1; overflow-y: auto; padding: 18px 20px 40px; }
.dr-foot { padding: 12px 20px; border-top: 1px solid var(--line); display: flex; gap: 8px; }
.fs { margin-bottom: 20px; }
.fs.flash, .fld.flash { animation: flashbg 1.4s ease-out; border-radius: 8px; }
@keyframes flashbg { 0%, 40% { background: var(--pri-bg); box-shadow: 0 0 0 8px var(--pri-bg); } 100% { background: transparent; box-shadow: 0 0 0 8px transparent; } }
.fs-title { font-size: 12px; font-weight: 700; color: var(--sub); letter-spacing: .5px; margin-bottom: 10px; text-transform: uppercase; }
.adv-toggle { width: 100%; text-align: left; background: #f6f7f9; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-weight: 600; font-size: 14px; margin-bottom: 14px; }
.fld { margin-bottom: 14px; }
.fld > label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.fld .req { color: var(--err); margin-left: 2px; }
.fld .opt { color: var(--sub); font-weight: 400; margin-left: 4px; font-size: 12px; }
.fld input[type=text], .fld input[type=number], .fld input[type=date], .fld input[type=time], .fld select, .fld textarea { width: 100%; padding: 8px 10px; border: 1px solid #cfd5de; border-radius: 6px; background: #fff; }
.fld input:focus, .fld select:focus, .fld textarea:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px rgba(88,182,168,.22); }
.fld input:disabled { background: #f1f3f6; }
.fld .hint { font-size: 12px; color: var(--sub); margin-top: 4px; }
.fld .err { font-size: 12px; color: var(--err); margin-top: 4px; }
.fld input.bad { border-color: var(--err); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.stbox { border: 1px solid #D4D4D4; border-radius: 4px; background: #fff; }
.st-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; border-bottom: 1px solid #E3E3E3; font-size: 13px; color: var(--sub); }
.st-head b { color: var(--txt); }
.st-head a { color: #2f8f81; text-decoration: none; font-weight: 600; }
.st-list { display: grid; grid-template-columns: 1fr 1fr; }
.st-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #F0F1F3; }
.st-row:nth-child(odd) { border-right: 1px solid #F0F1F3; }
.st-row:hover { background: #F5FAF9; }
.st-row input { display: none; }
.st-ck { width: 18px; height: 18px; border: 1.5px solid #c3c8cf; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; flex-shrink: 0; }
.st-row.on .st-ck { background: var(--pri); border-color: var(--pri); }
.st-nm { font-size: 14px; } .st-nm small { display: block; font-size: 11px; color: var(--sub); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.pick { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid #cfd5de; border-radius: 99px; background: #fff; font-size: 13px; cursor: pointer; user-select: none; }
.pick input { display: none; }
.pick.on { background: var(--pri-bg); border-color: var(--pri); color: var(--pri); font-weight: 600; }
.pick.dis { opacity: .4; cursor: not-allowed; }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; margin-bottom: 12px; background: #fcfcfd; }
.box.lock { opacity: .55; }
.box-t { font-weight: 700; font-size: 13px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
.sw-row { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
.sw-row label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; }
.notice { background: var(--warn-bg); color: #8a5300; border-radius: 6px; padding: 8px 12px; font-size: 13px; margin-bottom: 12px; line-height: 1.5; }
.slot { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.slot input { width: 120px !important; }
.optrow { display: grid; grid-template-columns: 1.3fr 1fr .8fr .8fr 1fr 30px; gap: 6px; align-items: center; margin-bottom: 6px; }
.optrow input, .optrow select { width: 100%; padding: 6px 8px; border: 1px solid #cfd5de; border-radius: 6px; font-size: 13px; }
.optrow.top { grid-template-columns: 1.3fr 1fr .8fr 1fr 30px; align-items: end; }
.of > span { display: block; font-size: 11px; color: var(--sub); margin-bottom: 3px; }
.optbox { padding: 10px 12px; }
.optbox .sub-t { font-size: 11px; font-weight: 600; color: var(--sub); margin: 10px 0 6px; }
.prow { display: grid; grid-template-columns: 96px 120px 1fr; gap: 10px; align-items: center; margin-bottom: 10px; }
.prow > label { font-size: 13px; font-weight: 600; }
.prow input { width: 100%; padding: 7px 10px; border: 1px solid #cfd5de; border-radius: 6px; font-size: 13px; }
.prow input:focus { outline: none; border-color: var(--pri); box-shadow: 0 0 0 3px rgba(88,182,168,.22); }
.prow .chips { gap: 6px; align-items: center; }
.prow .pick { padding: 4px 10px; font-size: 12px; }
.prow .na { font-size: 12px; color: var(--sub); }
.optbox .prow { grid-template-columns: 72px 100px 1fr; margin-bottom: 6px; }
.optbox .prow > label { font-size: 12px; font-weight: 500; }
.imgbox { display: flex; align-items: center; gap: 12px; }
.imgbox .th { width: 72px; height: 54px; border: 1px dashed #b9c2d0; border-radius: 6px; background: #f6f7f9 center/cover; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 11px; }
.tbl-mini { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl-mini th { font-size: 11px; color: var(--sub); font-weight: 600; text-align: center; padding: 4px; }
.tbl-mini td { padding: 5px 4px; text-align: center; border-top: 1px solid #eef0f3; }
.tbl-mini td:first-child, .tbl-mini th:first-child { text-align: left; }

/* modal */
.dlg { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 480px; max-width: 94vw; background: #fff; border-radius: 8px; z-index: 61; box-shadow: 0 24px 48px -12px rgba(0,0,0,.25); color: var(--txt); }
.dlg-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px; border-bottom: 1px solid #D4D4D4; }
.dlg-h h2 { margin: 0; font-size: 20px; font-weight: 600; }
.dlg-x { border: 0; background: transparent; font-size: 18px; color: var(--txt); width: 32px; height: 32px; border-radius: 4px; }
.dlg-x:hover { background: #F3F3F4; }
.dlg-b { padding: 20px 24px; font-size: 14px; line-height: 1.6; }
.dlg-f { display: flex; justify-content: flex-end; gap: 12px; padding: 16px 24px; border-top: 1px solid #D4D4D4; }
.dlg-btn { min-width: 88px; padding: 11px 20px; border: 0; border-radius: 4px; background: #F3F3F4; color: var(--txt); font-size: 14px; font-weight: 600; letter-spacing: .5px; }
.dlg-btn:hover { filter: brightness(.96); }
.dlg-btn.danger { background: #FF8A80; color: #fff; }
.modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 520px; max-width: 94vw; max-height: 86vh; overflow-y: auto; background: #fff; border-radius: 12px; z-index: 61; box-shadow: 0 20px 60px rgba(0,0,0,.3); padding: 22px 24px; }
.modal h2 { margin: 0 0 4px; font-size: 18px; }
.modal .row2 { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; }
.mscrim { z-index: 60; }
.toast { position: fixed; left: 50%; top: 12px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; min-width: 240px; max-width: calc(100vw - 32px); box-sizing: border-box; padding: 14px 16px; border-radius: 4px; z-index: 99; font-size: 14px; line-height: 1.5; box-shadow: 0 12px 16px -4px rgba(0,0,0,.1), 0 4px 6px -2px rgba(0,0,0,.05); }
.toast[hidden] { display: none; }
.toast svg { flex-shrink: 0; }
.toast.success { background: #EDF7ED; color: #1E4620; }
.toast.error { background: #FDEDED; color: #5F2120; }

/* ===== v9: follows Figma 菜單設定（簡化版） ===== */
.ic { display: block; flex-shrink: 0; }
.sidebar { width: 256px; padding: 24px 28px; display: block; overflow-y: auto; border-right: 1px solid #D4D4D4; }
.sb-menu { display: block; margin-bottom: 24px; }
.hamb { border: 0; background: none; padding: 0; cursor: pointer; display: flex; }
.sidebar { transition: width .2s ease, padding .2s ease; overflow-x: hidden; white-space: nowrap; }
.app.side-off .sidebar { width: 73px; padding-left: 12px; padding-right: 12px; }
.app.side-off .sb-menu { margin-left: 12px; }
.app.side-off .nv.h50 { height: 50px; }
.app.side-off .nv > .tx, .app.side-off .nv > .tx ~ img, .app.side-off .nv-sub { display: none; }
.app.side-off .nv { width: 48px; justify-content: center; }
.app.side-off .nv.has-sub { background: #E1F2F0; border-radius: 10px; }
.app.side-off .nv-div::after { left: 0; right: 0; }
.app.side-off .u-img { width: 120px; height: 90px; }
.app.side-off .u-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.app.side-off .u-card { min-width: 0; }
.nv { display: flex; align-items: center; gap: 16px; height: 48px; padding: 8px 12px; font-size: 16px; line-height: 1.1; color: var(--txt); border-radius: 4px; user-select: none; }
.nv .tx { flex: 1; }
.nv-sub { display: block; height: 40px; line-height: 40px; padding-left: 52px; font-size: 16px; color: var(--txt); border-radius: 4px; }
.nv-sub.active { background: #E1F2F0; border-radius: 10px; }
.nv-div { height: 24px; position: relative; }
.nv-div::after { content: ""; position: absolute; left: -28px; right: -28px; top: 12px; height: 1px; background: #D4D4D4; }
.topnav { height: 64px; background: #fff; border-bottom: 1px solid #D4D4D4; display: flex; align-items: center; gap: 20px; padding: 0 24px; flex-shrink: 0; }
.topnav .acct { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--txt); margin-left: 8px; }
.ptabs { box-sizing: border-box; height: 64px; background: #fff; display: flex; align-items: flex-end; gap: 12px; padding: 0 24px; flex-shrink: 0; border-bottom: 1px solid #D4D4D4; }
.ptab.off { color: var(--txt); border-bottom-color: transparent; cursor: pointer; }
.ptab.off:hover { color: var(--pri); }
button.ptab { background: none; border: 0; border-bottom: 4px solid var(--pri); font-family: inherit; cursor: pointer; }
button.ptab.off { border-bottom-color: transparent; }
.tg-co { font-size: 16px; line-height: 1.5; color: #53545C; }
.tg-chip { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: 100px; font-size: 14px; line-height: 1.5; white-space: nowrap; }
.tg-row { display: flex; align-items: center; gap: 24px; position: relative; min-height: 40px; }
.tg-l { width: 160px; flex-shrink: 0; font-size: 16px; line-height: 1.5; color: #53545C; }
.cp { position: absolute; z-index: 8; left: 184px; top: 40px; width: 250px; height: 403px; background: #fff; border-radius: 4px; box-shadow: 0 1px 8px rgba(0,0,0,.15); font-family: Roboto, "PingFang TC", sans-serif; user-select: none; }
.cp-sat { position: absolute; left: 10.5px; right: 10.5px; top: 10px; height: 150px; cursor: crosshair; touch-action: none; background-image: linear-gradient(to top, #000, rgba(0,0,0,0)), linear-gradient(to right, #fff, rgba(255,255,255,0)); }

.opt-btns { display: flex; gap: 12px; }
.opt-btn { height: 40px; padding: 8px 22px; border: 1px solid #D4D4D4; border-radius: 4px; background: #fff; font-size: 14px; font-weight: 600; letter-spacing: .5px; color: #53545C; }
.mn .optbox { gap: 0; padding: 0; overflow: hidden; }
.mn .optbox > .mn-oh { background: #F3F3F4; padding: 8px 12px; border-bottom: 1px solid #D4D4D4; }
.mn .optbox.closed > .mn-oh { border-bottom: 0; }
.mn .optbox .opt-body { display: flex; flex-direction: column; gap: 16px; padding: 12px; }
.mn .prow { margin: 0; }
.mn .optbox .prow { grid-template-columns: 168px 1fr; }
.mn .stbox { border-color: #D4D4D4; }
.mn .pick.dis, .ckb.dis { opacity: .4; cursor: not-allowed; }
.mn .imgbox .th { flex-shrink: 0; width: 72px; min-width: 72px; }
.mn .imgbox input[type=file] { font-size: 14px; color: #53545C; max-width: 100%; }

/* 存檔前檢核 dialog */
.dlg-sync .dlg-b { max-height: 62vh; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.sy-desc { font-size: 14px; line-height: 1.5; color: #53545C; }
.sy-box { border: 1px solid #D4D4D4; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 4px; }
.sy-head { display: flex; align-items: center; justify-content: space-between; padding: 0 0 8px; }
.sy-name { font-size: 16px; font-weight: 600; color: #53545C; }
.sy-ctl { display: flex; align-items: center; gap: 16px; font-size: 14px; color: #8E8F98; }

.sy-all { gap: 4px; }
.ckb.part .ckb-b::before { background: #58B6A8; border-color: #58B6A8; }
.ckb.part .ckb-b::after { content: ""; position: absolute; left: 16px; top: 20px; width: 10px; height: 2px; background: #fff; }
.sy-row { display: flex; align-items: center; gap: 4px; padding: 0 12px 0 40px; border-radius: 4px; }
.sy-row:hover { background: #F5FAF9; }
.sy-sn { font-size: 16px; color: #53545C; }
.sy-n { margin-left: auto; font-size: 14px; color: #8E8F98; }
.dlg-checks { z-index: 62; }
.dlg-checks .dlg-h h2 { display: flex; align-items: center; gap: 8px; }
.dlg-scroll { max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
.dlg-scroll section { margin: 0; }
.dlg-scroll h3 { font-size: 16px; font-weight: 600; margin: 0 0 8px; color: #53545C; }
.dlg-checks .chk-count { background: #F3F3F4; color: #53545C; border-radius: 100px; padding: 2px 10px; font-size: 14px; font-weight: 600; line-height: 1.5; }
.dlg-scroll .chk-item { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding: 12px; border: 1px solid #D4D4D4; border-radius: 8px; background: #fff; margin-bottom: 0; cursor: pointer; filter: none; }
.dlg-scroll .chk-item:hover { background: #F5FAF9; filter: none; }
.dlg-checks section { display: flex; flex-direction: column; gap: 12px; }
.dlg-checks .dlg-scroll section h3 { margin: 0; }
.chk-lead { font-size: 14px; line-height: 1.5; color: #53545C; }
.chk-main { min-width: 0; flex: 1; }
.chk-t { display: flex; align-items: center; gap: 8px; height: 24px; font-size: 16px; font-weight: 600; line-height: 1.5; color: #53545C; }
.chk-lv { background: rgba(141,140,140,.2); border-radius: 100px; padding: 0 10px; height: 24px; display: inline-flex; align-items: center; font-size: 14px; font-weight: 400; line-height: 1.5; color: #53545C; flex-shrink: 0; }
.chk-m { padding-top: 2px; font-size: 14px; line-height: 21px; color: #53545C; }
.chk-go { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 8px 12px; font-size: 14px; font-weight: 600; letter-spacing: .5px; color: #58B6A8; white-space: nowrap; flex-shrink: 0; }
.dlg-checks .res { border: 1px solid #D4D4D4; border-radius: 8px; padding: 12px; margin: 0; font-size: 14px; color: #53545C; display: flex; flex-direction: column; gap: 4px; }
.dlg-checks .res + .res { margin-top: 12px; }
.res-h { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 600; line-height: 1.5; }
.res-st { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 100px; background: #F3F3F4; font-size: 14px; font-weight: 400; color: #53545C; }
.res-st::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #FF8A80; }
.res-st.fail::before { background: #FF8A80; }
.res-st.part::before { background: #FFCA28; }
.res-st.ok::before { background: #66BB6A; }
.res-l { font-size: 14px; line-height: 1.5; color: #53545C; }
.res-l.sub { color: #8E8F98; }
.dlg-scroll .chk-ok { padding: 12px 16px; border-radius: 8px; background: #E1F2F0; color: #53545C; font-size: 14px; }
.dlg-scroll .muted { font-size: 14px; color: #8E8F98; }
.dlg-scroll .log { padding: 8px 0; font-size: 14px; color: #53545C; border-bottom: 1px solid #D4D4D4; }
.dlg-scroll .log:last-child { border-bottom: 0; }
.dlg-scroll .log small { display: block; font-size: 12px; color: #8E8F98; }
.drag-tb tr.empty-tr td, table.tb tr.empty-tr td { padding: 0; border-bottom: 0; background: #F5F8F9; }
.empty-blk { background: #F5F8F9; border-radius: 10px; margin-top: 12px; }
.empty-st { height: 303px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
.empty-st .es-t { font-size: 20px; font-weight: 600; line-height: 1.1; color: #8E8F98; }
.empty-st .es-s { font-size: 16px; line-height: 1.5; color: #8E8F98; }

/* ================= Textfield 狀態（依 Portal 2.0 Style Guide 2545:7755）=================
   enable：1px #D4D4D4／hover：1px #232323／focus：2px #86CBC1，標籤 #58B6A8／disable：底 #F3F3F4／error：#FF8A80 */
.fld input[type=text],
.fld input[type=number],
.fld input[type=date],
.fld input[type=time],
.fld select,
.fld textarea,
.search,
.drawer .st-search input,
.drawer .slot input,
.drawer .optrow input,
.drawer .optrow select,
.drawer .prow input,
.inl-input,
.qp-in,
.msel-box,
.sc-box { border-radius: 4px; }
.fld input[type=text]:hover:not(:focus):not(:disabled):not(.bad),
.fld input[type=number]:hover:not(:focus):not(:disabled):not(.bad),
.fld input[type=date]:hover:not(:focus):not(:disabled):not(.bad),
.fld input[type=time]:hover:not(:focus):not(:disabled):not(.bad),
.fld select:hover:not(:focus):not(:disabled):not(.bad),
.fld textarea:hover:not(:focus):not(:disabled):not(.bad),
.search:hover:not(:focus):not(:disabled):not(.bad),
.drawer .st-search input:hover:not(:focus):not(:disabled):not(.bad),
.drawer .slot input:hover:not(:focus):not(:disabled):not(.bad),
.drawer .optrow input:hover:not(:focus):not(:disabled):not(.bad),
.drawer .optrow select:hover:not(:focus):not(:disabled):not(.bad),
.drawer .prow input:hover:not(:focus):not(:disabled):not(.bad),
.inl-input:hover:not(:focus):not(:disabled):not(.bad),
.qp-in:hover:not(:focus-within):not(.bad),
.msel-box:hover:not(:focus-within):not(.bad),
.sc-box:hover:not(:focus-within):not(.bad) { border-color: #232323 !important; }
.fld input[type=text]:focus,
.fld input[type=number]:focus,
.fld input[type=date]:focus,
.fld input[type=time]:focus,
.fld select:focus,
.fld textarea:focus,
.search:focus,
.drawer .st-search input:focus,
.drawer .slot input:focus,
.drawer .optrow input:focus,
.drawer .optrow select:focus,
.drawer .prow input:focus,
.inl-input:focus,
.qp-in:focus-within,
.msel-box:focus-within,
.sc-box:focus-within { outline: none !important; border-color: #86CBC1 !important; box-shadow: inset 0 0 0 1px #86CBC1 !important; }
.qp-in:focus-within input { box-shadow: none !important; }
.fld:focus-within > label, .qp-fld:focus-within .qp-fl, .sbox .search:focus ~ .s-lbl { color: #58B6A8 !important; }
.fld input[type=text]:disabled,
.fld input[type=number]:disabled,
.fld input[type=date]:disabled,
.fld input[type=time]:disabled,
.fld select:disabled,
.fld textarea:disabled,
.search:disabled,
.drawer .st-search input:disabled,
.drawer .slot input:disabled,
.drawer .optrow input:disabled,
.drawer .optrow select:disabled,
.drawer .prow input:disabled,
.inl-input:disabled { background: #F3F3F4 !important; border-color: #D4D4D4 !important; color: #8E8F98 !important; cursor: not-allowed; box-shadow: none !important; }
.qp-in:has(input:disabled) { background: #F3F3F4; border-color: #D4D4D4; }
.fld:has(> :disabled) > label, .qp-fld:has(input:disabled) .qp-fl { color: #8E8F98 !important; background: linear-gradient(to bottom, transparent 50%, #F3F3F4 50%) !important; }
.fld input.bad, .fld select.bad, .fld textarea.bad, .qp-in.bad, .msel-box.bad, .sc-box.bad { border-color: #FF8A80 !important; }
.fld input.bad:focus, .fld select.bad:focus, .fld textarea.bad:focus, .qp-in.bad:focus-within, .msel-box.bad:focus-within, .sc-box.bad:focus-within { box-shadow: inset 0 0 0 1px #FF8A80 !important; }
.fld:has(> .bad) > label, .qp-fld.bad .qp-fl, .fld:has(> .bad):focus-within > label { color: #FF8A80 !important; }
</style>
</head>

function storeErrs(m, sid, v) {

/* ================= Sync ================= */
function runSync() {
  const res = [];
  [['uber','Uber Eats'],['fp','Foodpanda']].forEach(([ch, name]) => {
    const stores = ui.syncDlg.sel[ch];
    if (!stores.length) { res.push({ plat:name, cls:'fail', label:'未同步', detail:'<div class="res-l sub">沒有選擇任何商店</div>' }); return; }
    let ok = 0; const lines = [], skipped = [], failed = [], noMenu = [], done = new Set();
    stores.forEach(sid => {
      const ms = S.menus.filter(m => (m.stores || []).includes(sid) && m.channels[ch]);
      if (!ms.length) { noMenu.push(storeName(sid)); return; }
      const synced = [];
      ms.forEach(m => {
        const errs = menuErrors(m).filter(e => e.includes('時段'));
        if (errs.length) { failed.push(`「${m.name}」${errs[0]}`); return; }
        synced.push(m.name);
        if (done.has(m.id)) return; done.add(m.id);
        catsOf(m.id).forEach(c => {
          const its = itemsOf(c.id).filter(i => i.enabled && sale(i)[ch]);
          if (!its.length) { skipped.push(`類別「${c.name}」為空，已略過`); return; }
          its.forEach(i => { if (!i.sku || skuError(i, i.sku, i.id)) skipped.push(`品項「${i.name}」SKU 無效，已略過`); else ok++; });
        });
      });
      if (synced.length) lines.push(`${storeName(sid)}：${synced.join('、')}`);
    });
    const cls = !ok ? 'fail' : (failed.length || skipped.length || noMenu.length) ? 'part' : 'ok';
    const L = t => `<div class="res-l">${t}</div>`, G = t => `<div class="res-l sub">${t}</div>`;
    const skipItems = [...new Set(skipped)];
    res.push({ plat:name, cls, label:{ ok:'已完成', part:'部分完成', fail:'未完成' }[cls],
      detail: L(ok ? `已送出 ${ok} 個品項` : '沒有品項被送出')
        + lines.map(x => G(`已同步　${h(x)}`)).join('')
        + (noMenu.length ? G(`${noMenu.length} 間商店沒有綁定可同步的菜單，已略過：${h(noMenu.join('、'))}`) : '')
        + failed.map(x => G(h(x))).join('')
        + skipItems.map(x => G(h(x))).join('') });
  });
  S_log('同步至外送平台：' + res.map(r => `${r.plat} ${r.label}`).join('、'));
  ui.syncRes = res; ui.syncDlg = null; ui.checks = true; toast('同步完成（模擬）'); render();
}

/* ================= 菜單匯入／匯出（CSV） ================= */
const IMP_COLS = ['類別', '品項名稱', '後台名稱', 'SKU', '價格', '說明', '販售', '屬性'];
const csvCell = v => { v = String(v ?? ''); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
function csvDownload(name, rows) {
  const blob = new Blob(['﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function csvParse(text) {
  const rows = []; let row = [], cur = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
    else cur += c;
  }
  if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function exportMenu() {
  const m = visMenus()[0]; if (!m) return;
  const rows = [IMP_COLS];
  catsOf(m.id).forEach(c => itemsOf(c.id).forEach(i => rows.push([c.name, i.name, i.adminName || '', i.sku, i.price, i.desc || '', i.enabled === false ? 'N' : 'Y', (i.attrs || []).map(a => attrById(a)?.name).filter(Boolean).join('、')])));
  if (rows.length === 1) { toast('這份菜單還沒有品項可匯出', 'error'); return; }
  const d = new Date(), ds = d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
  csvDownload(`${m.name}_${ds}.csv`, rows);
  S_log('匯出菜單：' + m.name); toast(`已匯出 ${rows.length - 1} 個品項`);
}
function impTemplate() {
  csvDownload('菜單匯入範本.csv', [IMP_COLS, ['烏龍麵', '牛肉烏龍麵', 'beef-udon', 'MY002', 139, '期間限定商品', 'Y', '味噌湯套餐、飲料套餐'], ['烏龍麵', '湯烏龍麵', '', 'MY004', 109, '', 'Y', '']]);
}
function impAnalyze(text, fileName) {
  const res = { file:fileName, name:fileName.replace(/\.(csv|xlsx)$/i, '').trim(), errors:[], warns:[], ops:[], cats:[] };
  const rows = (Array.isArray(text) ? text : csvParse(text)).map(r => r.map(x => String(x ?? '')));
  if (!rows.length) { res.fatal = '檔案是空的'; return res; }
  const head = rows[0].map(x => x.trim()), ix = {};
  IMP_COLS.forEach(c => ix[c] = head.indexOf(c));
  const miss = ['類別', '品項名稱', '價格'].filter(c => ix[c] < 0);
  if (miss.length) { res.fatal = `找不到必要欄位：${miss.join('、')}。請使用匯出檔或下載範本來編輯`; return res; }
  if (rows.length < 2) { res.fatal = '檔案中沒有任何品項資料'; return res; }
  const g = (r, c) => ix[c] < 0 ? '' : (r[ix[c]] || '').trim();
  const seenSku = {}, cats = [];
  rows.slice(1).forEach((r, k) => {
    const n = k + 2, cat = g(r, '類別'), name = g(r, '品項名稱'), sku = g(r, 'SKU'), price = g(r, '價格'), sale = g(r, '販售').toUpperCase();
    const bad = msg => res.errors.push(`第 ${n} 列：${msg}`);
    if (!cat) return bad('「類別」不可空白');
    if (!name) return bad('「品項名稱」不可空白');
    if (price === '' || isNaN(+price) || +price < 0) return bad(`「價格」需為 0 以上的數字（目前是「${price}」）`);
    if (sale && !['Y', 'N'].includes(sale)) return bad('「販售」只能填 Y 或 N');
    if (sku) { if (seenSku[sku]) return bad(`SKU「${sku}」與第 ${seenSku[sku]} 列重複`); seenSku[sku] = n; }
    const attrs = [];
    g(r, '屬性').split(/[、,，]/).map(x => x.trim()).filter(Boolean).forEach(an => { const a = S.attrs.find(x => x.name === an || x.adminName === an); if (a) attrs.push(a.id); else res.warns.push(`第 ${n} 列：找不到屬性「${an}」，已略過`); });
    if (!cats.includes(cat)) cats.push(cat);
    res.ops.push({ cat, name, adminName:g(r, '後台名稱'), sku, price:+price, desc:g(r, '說明'), enabled:sale !== 'N', attrs });
  });
  res.cats = cats;
  return res;
}
function impLoad(f) {
  const done = r => { ui.impDlg = r; render(); };
  if (!/\.xlsx?$/i.test(f.name)) return f.text().then(tx => done(impAnalyze(tx, f.name)));
  const lib = window.XLSX ? Promise.resolve() : new Promise((ok, no) => { const sc = document.createElement('script'); sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
  return lib.then(() => f.arrayBuffer()).then(buf => {
    const wb = XLSX.read(buf), ws = wb.Sheets[wb.SheetNames[0]];
    done(impAnalyze(XLSX.utils.sheet_to_json(ws, { header:1, defval:'', raw:false }).filter(r => r.some(x => String(x).trim() !== '')), f.name));
  }).catch(() => done({ file:f.name, fatal:'無法讀取這個檔案，請確認網路連線與檔案格式，或改用 CSV' }));
}

/* 自訂 Tooltip：把原生 title 轉成設計稿樣式 */
(function () {
  const tip = document.createElement('div'); tip.className = 'kds-tip'; tip.setAttribute('role', 'tooltip'); document.body.appendChild(tip);
  let cur = null;
  const hide = () => { tip.classList.remove('show'); cur = null; };
  document.addEventListener('mouseover', e => {
    const el = e.target.closest && e.target.closest('[title],[data-tip]');
    if (!el) { if (cur) hide(); return; }
    if (el === cur) return;
    if (el.hasAttribute('title')) { el.dataset.tip = el.getAttribute('title'); el.removeAttribute('title'); }
    const text = el.dataset.tip; if (!text) { hide(); return; }
    cur = el; tip.textContent = text; tip.style.left = '0px'; tip.style.top = '0px';
    const r = el.getBoundingClientRect(), t = tip.getBoundingClientRect(), gap = 6;
    let top = r.top - t.height - gap; if (top < 4) top = r.bottom + gap;
    const left = Math.max(4, Math.min(r.left + r.width / 2 - t.width / 2, innerWidth - t.width - 4));
    tip.style.left = left + 'px'; tip.style.top = top + 'px'; tip.classList.add('show');
  });
  document.addEventListener('mousedown', hide, true);
  document.addEventListener('scroll', hide, true);
})();

// 類別／品項排序：按住最前方 menu icon 拖曳列（僅限同一群組內）
(() => {
  let src = null;
  const ROW = '.drag-tb tr[data-row]', MARK = '.drag-tb tr.drop-before,.drag-tb tr.drop-after';
  const clr = () => document.querySelectorAll('.drag-tb tr.drop-before,.drag-tb tr.drop-after,.drag-tb tr.dragging').forEach(r => r.classList.remove('drop-before', 'drop-after', 'dragging'));
  const same = tr => tr && tr !== src && tr.dataset.kind === src.dataset.kind && tr.dataset.grp === src.dataset.grp;
  document.addEventListener('mousedown', e => { const hd = e.target.closest('.drag-h'); if (hd) hd.closest('tr').draggable = true; });
  document.addEventListener('mouseup', () => document.querySelectorAll('.drag-tb tr[draggable]').forEach(r => r.removeAttribute('draggable')));
  document.addEventListener('dragstart', e => { const tr = e.target.closest && e.target.closest(ROW); if (!tr) return; src = tr; e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', tr.dataset.row); setTimeout(() => tr.classList.add('dragging'), 0); });
  document.addEventListener('dragover', e => {
    if (!src) return; const tr = e.target.closest(ROW); if (!same(tr)) return;
    e.preventDefault(); const r = tr.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
    document.querySelectorAll(MARK).forEach(x => x.classList.remove('drop-before', 'drop-after'));
    tr.classList.add(after ? 'drop-after' : 'drop-before');
  });
  document.addEventListener('drop', e => {
    if (!src) return; const tr = e.target.closest(ROW); if (!same(tr)) { clr(); return; }
    e.preventDefault(); const after = tr.classList.contains('drop-after');
    const kind = src.dataset.kind, g = src.dataset.grp, id = src.dataset.row;
    if (kind === 'tag') {
      const ids = (ui.tagOrder || S.tags.map(x => x.id)).slice();
      ids.splice(ids.indexOf(id), 1); let j = ids.indexOf(tr.dataset.row); if (after) j++;
      ids.splice(j, 0, id); ui.tagOrder = ids;
    } else if (kind === 'attr') {
      const ids = (ui.attrOrder || S.attrs.map(x => x.id)).slice();
      ids.splice(ids.indexOf(id), 1); let j = ids.indexOf(tr.dataset.row); if (after) j++;
      ids.splice(j, 0, id); ui.attrOrder = ids;
    } else {
      const cat = kind === 'cat', key = cat ? 'catOrder' : 'itemOrder';
      const ids = (ui[key]?.[g] || (cat ? catsOf(g) : itemsOf(g)).map(x => x.id)).slice();
      ids.splice(ids.indexOf(id), 1); let j = ids.indexOf(tr.dataset.row); if (after) j++;
      ids.splice(j, 0, id); (ui[key] = ui[key] || {})[g] = ids;
    }
    src = null; render();
  });
  document.addEventListener('dragend', () => { src = null; clr(); document.querySelectorAll('.drag-tb tr[draggable]').forEach(r => r.removeAttribute('draggable')); });
})();
